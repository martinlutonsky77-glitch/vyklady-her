ídce, nebo</text><text x="280" y="150" font-size="11.5" fill="var(--cds-text-primary)">vyměnit 3 karty u Messengeru za</text><text x="280" y="166" font-size="11.5" fill="var(--cds-text-primary)">nové.</text></g><g><rect x="508" y="52" width="224" height="160" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><circle cx="530" cy="76" r="11" fill="var(--cds-chart-categorical-3)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-3)" stroke-width="1.25"></circle><text x="530" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="var(--cds-text-primary)">3</text><text x="550" y="80" font-weight="600" fill="var(--cds-text-primary)">Nákup</text><line x1="520" y1="96" x2="720" y2="96" stroke="var(--cds-chart-categorical-3)" stroke-width="1.25"></line><text x="520" y="118" font-size="11.5" fill="var(--cds-text-primary)">Vyber kartu u Messengeru a zaplať</text><text x="520" y="134" font-size="11.5" fill="var(--cds-text-primary)">cenu mínus slevy, nejméně 0</text><text x="520" y="150" font-size="11.5" fill="var(--cds-text-primary)">zlatých. Kartu můžeš vzít i rubem</text><text x="520" y="166" font-size="11.5" fill="var(--cds-text-primary)">nahoru zdarma: dostaneš 6 zlatých</text><text x="520" y="182" font-size="11.5" fill="var(--cds-text-primary)">a 2 klíče.</text></g><g><rect x="28" y="228" width="224" height="160" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><circle cx="50" cy="252" r="11" fill="var(--cds-chart-categorical-4)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-4)" stroke-width="1.25"></circle><text x="50" y="256" text-anchor="middle" font-size="12" font-weight="600" fill="var(--cds-text-primary)">4</text><text x="70" y="256" font-weight="600" fill="var(--cds-text-primary)">Položení</text><line x1="40" y1="272" x2="240" y2="272" stroke="var(--cds-chart-categorical-4)" stroke-width="1.25"></line><text x="40" y="294" font-size="11.5" fill="var(--cds-text-primary)">První kartu pol
