<figure class="schema"><div class="schema-plocha"><svg viewBox="0 0 760 436" role="img" aria-label="Osm fází tahu v Marvel Dice Throne, hod na útok a hod na obranu jsou zvýrazněny" font-size="13"><defs><marker id="dt-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="var(--cds-text-primary)">V tahu projdeš osm fází, hody na útok a na obranu jsou zvýrazněny</text><g><rect x="20" y="60" width="168" height="124" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="32" y="84" font-weight="600" fill="var(--cds-text-primary)">1 · Fáze údržby</text><text x="32" y="104" font-size="11.5" fill="var(--cds-text-secondary)">Vyřešíš efekty stavů a</text><text x="32" y="119.5" font-size="11.5" fill="var(--cds-text-secondary)">stálých schopností,</text><text x="32" y="135" font-size="11.5" fill="var(--cds-text-secondary)">které se spouštějí</text><text x="32" y="150.5" font-size="11.5" fill="var(--cds-text-secondary)">v údržbě.</text></g><g><rect x="204" y="60" width="168" height="124" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="216" y="84" font-weight="600" fill="var(--cds-text-primary)">2 · Fáze příjmu</text><text x="216" y="104" font-size="11.5" fill="var(--cds-text-secondary)">Získáš 1 BB (nejvýš 15)</text><text x="216" y="119.5" font-size="11.5" fill="var(--cds-text-secondary)">a dobereš 1 kartu.</text><text x="216" y="135" font-size="11.5" fill="var(--cds-text-secondary)">Začínající hráč ji</text><text x="216" y="150.5" font-size="11.5" fill="var(--cds-text-secondary)">v prvním tahu přeskočí.</text></g><g><rect x="388" y="60" width="168" height="124" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="400" y="84" font-weight="600" fill="var(--cds-text-primary)">3 · Hlavní fáze (1)</text><text x="400" y="104" font-size="11.5" fill="var(--cds-text-secondary)">Za BB zahraješ vylepšení</text><text x="400" y="119.5" font-size="11.5" fill="var(--cds-text-secondary)">hrdiny a karty akcí</text><text x="400" y="135" font-size="11.5" fill="var(--cds-text-secondary)">hlavní fáze. Karty můžeš</text><text x="400" y="150.5" font-size="11.5" fill="var(--cds-text-secondary)">prodat po 1 BB.</text></g><g><rect x="572" y="60" width="168" height="124" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="584" y="84" font-weight="600" fill="var(--cds-text-primary)">4 · Fáze hodu</text><text x="584" y="100" font-weight="600" fill="var(--cds-text-primary)">na útok</text><text x="584" y="120" font-size="11.5" fill="var(--cds-text-secondary)">Hodíš pěti kostkami, až</text><text x="584" y="135.5" font-size="11.5" fill="var(--cds-text-secondary)">třikrát, a oznámíš jednu</text><text x="584" y="151" font-size="11.5" fill="var(--cds-text-secondary)">útočnou schopnost.</text></g><g><rect x="20" y="240" width="168" height="124" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="32" y="264" font-weight="600" fill="var(--cds-text-primary)">5 · Fáze hodu</text><text x="32" y="280" font-weight="600" fill="var(--cds-text-primary)">na zacílení</text><text x="32" y="300" font-size="11.5" fill="var(--cds-text-secondary)">Ve hře dvou ji přeskočíš.</text><text x="32" y="315.5" font-size="11.5" fill="var(--cds-text-secondary)">Ve více hráčích se v ní</text><text x="32" y="331" font-size="11.5" fill="var(--cds-text-secondary)">určuje, koho napadneš.</text></g><g><rect x="204" y="240" width="168" height="124" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="216" y="264" font-weight="600" fill="var(--cds-text-primary)">6 · Fáze hodu</text><text x="216" y="280" font-weight="600" fill="var(--cds-text-primary)">na obranu</text><text x="216" y="300" font-size="11.5" fill="var(--cds-text-secondary)">Pokud jsi spustil útok,</text><text x="216" y="315.5" font-size="11.5" fill="var(--cds-text-secondary)">napadený hodí obrannými</text><text x="216" y="331" font-size="11.5" fill="var(--cds-text-secondary)">kostkami. Zranění se</text><text x="216" y="346.5" font-size="11.5" fill="var(--cds-text-secondary)">uplatní až na konci.</text></g><g><rect x="388" y="240" width="168" height="124" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="400" y="264" font-weight="600" fill="var(--cds-text-primary)">7 · Hlavní fáze (2)</text><text x="400" y="284" font-size="11.5" fill="var(--cds-text-secondary)">Probíhá stejně jako</text><text x="400" y="299.5" font-size="11.5" fill="var(--cds-text-secondary)">hlavní fáze (1).</text></g><g><rect x="572" y="240" width="168" height="124" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="584" y="264" font-weight="600" fill="var(--cds-text-primary)">8 · Odkládací fáze</text><text x="584" y="284" font-size="11.5" fill="var(--cds-text-secondary)">Prodáváš karty, dokud</text><text x="584" y="299.5" font-size="11.5" fill="var(--cds-text-secondary)">v ruce nemáš nejvýš 6.</text></g><g fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"><path d="M188 122H204" marker-end="url(#dt-arrow)"></path><path d="M372 122H388" marker-end="url(#dt-arrow)"></path><path d="M556 122H572" marker-end="url(#dt-arrow)"></path><path d="M188 302H204" marker-end="url(#dt-arrow)"></path><path d="M372 302H388" marker-end="url(#dt-arrow)"></path><path d="M556 302H572" marker-end="url(#dt-arrow)"></path><path d="M656 184V212H104V240" marker-end="url(#dt-arrow)"></path></g><text x="24" y="400" font-size="12" fill="var(--cds-text-secondary)">Ve fázi 4 hodíš kostkami ty, ve fázi 6 hodí obrannými kostkami napadený.</text><text x="24" y="418" font-size="12" fill="var(--cds-text-secondary)">Zranění, obrany a léčení se uplatní naráz až na konci fáze 6.</text></svg></div><figcaption>tah · osm fází, hod na útok a hod na obranu zvýrazněny</figcaption></figure>
