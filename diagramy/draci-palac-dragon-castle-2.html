<figure class="schema"><div class="schema-plocha"><svg viewBox="0 0 760 758" role="img" aria-label="Tah v Dračím paláci: kámen, způsob dokončení, položení, sloučení, svatyně a konec hry" font-size="13"><defs><marker id="dp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="20" y="32" font-size="15" font-weight="600" fill="var(--cds-text-primary)">V každém tahu vezmeš kámen, dokončíš tah a případně sloučíš a postavíš svatyni</text><g><rect x="190" y="52" width="380" height="72" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="202" y="76" font-weight="600" fill="var(--cds-text-primary)">1 · Vezmi dostupný kámen</text><text x="202" y="96" font-size="11.5" fill="var(--cds-text-secondary)">Vždy nejdřív vezmeš jeden kámen z vrchního patra paláce.</text><text x="202" y="111.5" font-size="11.5" fill="var(--cds-text-secondary)">Má mít volnou aspoň jednu dlouhou stranu.</text></g><g><rect x="20" y="160" width="224" height="90" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="32" y="184" font-weight="600" fill="var(--cds-text-primary)">2a · Pár kamenů</text><text x="32" y="204" font-size="11.5" fill="var(--cds-text-secondary)">Vezmeš druhý, úplně stejný</text><text x="32" y="219.5" font-size="11.5" fill="var(--cds-text-secondary)">dostupný kámen z kteréhokoli</text><text x="32" y="235" font-size="11.5" fill="var(--cds-text-secondary)">patra.</text></g><g><rect x="268" y="160" width="224" height="90" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="280" y="184" font-weight="600" fill="var(--cds-text-primary)">2b · Kámen a svatyně</text><text x="280" y="204" font-size="11.5" fill="var(--cds-text-secondary)">Vezmeš si ze zásoby 1 svatyni</text><text x="280" y="219.5" font-size="11.5" fill="var(--cds-text-secondary)">do svého inventáře.</text></g><g><rect x="516" y="160" width="224" height="90" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="528" y="184" font-weight="600" fill="var(--cds-text-primary)">2c · Odhození kamene</text><text x="528" y="204" font-size="11.5" fill="var(--cds-text-secondary)">Kámen odložíš rubem nahoru</text><text x="528" y="219.5" font-size="11.5" fill="var(--cds-text-secondary)">vedle své desky a vezmeš si</text><text x="528" y="235" font-size="11.5" fill="var(--cds-text-secondary)">1 bod.</text></g><g><rect x="20" y="282" width="472" height="68" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="32" y="306" font-weight="600" fill="var(--cds-text-primary)">3 · Polož kameny na desku</text><text x="32" y="326" font-size="11.5" fill="var(--cds-text-secondary)">Lícem nahoru na prázdné pole nebo na kámen otočený rubem nahoru.</text><text x="32" y="341.5" font-size="11.5" fill="var(--cds-text-secondary)">Nikdy ne na kámen lícem nahoru a nikdy ne na svatyni.</text></g><g><rect x="20" y="374" width="472" height="68" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="32" y="398" font-weight="600" fill="var(--cds-text-primary)">4 · Slouč, vznikla-li skupina</text><text x="32" y="418" font-size="11.5" fill="var(--cds-text-secondary)">Skupina 4 a víc kamenů stejného druhu sousedících přes hranu se musí sloučit.</text><text x="32" y="433.5" font-size="11.5" fill="var(--cds-text-secondary)">Otočíš ji rubem nahoru a hned dostaneš body.</text></g><g><rect x="20" y="466" width="472" height="68" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="32" y="490" font-weight="600" fill="var(--cds-text-primary)">5 · Postav svatyni, chceš-li</text><text x="32" y="510" font-size="11.5" fill="var(--cds-text-secondary)">Smíš ji postavit ze svého inventáře jen na právě sloučené kameny.</text><text x="32" y="525.5" font-size="11.5" fill="var(--cds-text-secondary)">Frakční skupina dovolí 1 svatyni, speciální skupina 2.</text></g><g><rect x="20" y="566" width="720" height="56" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="32" y="590" font-weight="600" fill="var(--cds-text-primary)">Konec tahu</text><text x="32" y="610" font-size="11.5" fill="var(--cds-text-secondary)">Hraje další hráč po směru hodinových ručiček.</text></g><g><rect x="20" y="650" width="720" height="90" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="32" y="674" font-weight="600" fill="var(--cds-text-primary)">Konec hry</text><text x="32" y="694" font-size="11.5" fill="var(--cds-text-secondary)">Když na začátku tahu zbývá v paláci jen přízemí, smí se přivolat drak za 2 body. Vykřičník na</text><text x="32" y="709.5" font-size="11.5" fill="var(--cds-text-secondary)">odpočítávání spustí poslední kolo. Pak se sečtou sloučení, svatyně (1, 2, nebo 3 body podle patra),</text><text x="32" y="725" font-size="11.5" fill="var(--cds-text-secondary)">odhození, odpočítávací žetony a dračí karta.</text></g><text x="516" y="300" font-size="11.5" fill="var(--cds-text-secondary)">Kartu ducha smíš použít</text><text x="516" y="316" font-size="11.5" fill="var(--cds-text-secondary)">kdykoli během svého tahu,</text><text x="516" y="332" font-size="11.5" fill="var(--cds-text-secondary)">nejvýš jednou.</text><text x="516" y="380" font-size="11.5" fill="var(--cds-text-secondary)">Odhození nic nepokládá,</text><text x="516" y="396" font-size="11.5" fill="var(--cds-text-secondary)">takže tah končí hned.</text><g fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"><path d="M380 124V160" marker-end="url(#dp-arrow)"></path><path d="M380 142H132V160" marker-end="url(#dp-arrow)"></path><path d="M380 142H628V160" marker-end="url(#dp-arrow)"></path><path d="M132 250V282" marker-end="url(#dp-arrow)"></path><path d="M380 250V282" marker-end="url(#dp-arrow)"></path><path d="M256 350V374" marker-end="url(#dp-arrow)"></path><path d="M256 442V466" marker-end="url(#dp-arrow)"></path><path d="M256 534V566" marker-end="url(#dp-arrow)"></path><path d="M700 250V566" marker-end="url(#dp-arrow)"></path></g></svg></div><figcaption>tah · kámen, akce, položení, sloučení, svatyně, konec hry</figcaption></figure>
