ndary)">nebo hrdinský čin.</text></g><g><rect x="272" y="212" width="216" height="128" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="286" y="238" font-weight="600" fill="var(--cds-text-primary)">Obětina</text><text x="286" y="258" font-size="11.5" fill="var(--cds-text-secondary)">Zaplatíš zlato a vezmeš ze</text><text x="286" y="274" font-size="11.5" fill="var(--cds-text-secondary)">svatyně jednu nebo víc</text><text x="286" y="290" font-size="11.5" fill="var(--cds-text-secondary)">různých stěn. Hned je</text><text x="286" y="306" font-size="11.5" fill="var(--cds-text-secondary)">přikuješ na kostky místo</text><text x="286" y="322" font-size="11.5" fill="var(--cds-text-secondary)">starých.</text></g><g><rect x="520" y="212" width="216" height="128" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="534" y="238" font-weight="600" fill="var(--cds-text-primary)">Hrdinský čin</text><text x="534" y="258" font-size="11.5" fill="var(--cds-text-secondary)">Zaplatíš úlomky podle karty,</text><text x="534" y="274" font-size="11.5" fill="var(--cds-text-secondary)">hrdina jde k ostrovu a</text><text x="534" y="290" font-size="11.5" fill="var(--cds-text-secondary)">vezmeš kartu. Kdo tam stál,</text><text x="534" y="306" font-size="11.5" fill="var(--cds-text-secondary)">je vyhnán na start a dostane</text><text x="534" y="322" font-size="11.5" fill="var(--cds-text-secondary)">božské požehnání.</text></g><g><rect x="272" y="368" width="464" height="64" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="286" y="394" font-weight="600" fill="var(--cds-text-primary)">4 · Druhá akce</text><text x="286" y="414" font-size="11.5" fill="var(--cds-text-secondary)">Za 2 sluneční úlomky můžeš jednou za tah provést ještě jednu akci.</text></g><g><rect x="24" y="212" width="216" height="112" rx="8" fill="none" fill-opacity="1" stroke="va
