<figure class="schema"><div class="schema-plocha"><svg viewBox="0 0 760 724" role="img" aria-label="Útok krok za krokem: zbraň a cíl, hod, kontrola X na modré kostce, kontrola dostupu, náboje, štíty" font-size="13"><defs><marker id="tah-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="24" y="32" font-size="15" font-weight="600" fill="var(--cds-text-primary)">Útok můžou zastavit dvě kontroly, teprve pak se vyhodnotí náboje a štíty</text><g><rect x="60" y="52" width="260" height="80" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="74" y="78" font-weight="600" fill="var(--cds-text-primary)">1 · Zbraň a cíl</text><text x="74" y="98" font-size="11.5" fill="var(--cds-text-secondary)">Na blízko zasáhneš sousední pole,</text><text x="74" y="114" font-size="11.5" fill="var(--cds-text-secondary)">na dálku cíl v přímé viditelnosti.</text></g><g><rect x="60" y="156" width="260" height="80" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="74" y="182" font-weight="600" fill="var(--cds-text-primary)">2 · Hod</text><text x="74" y="202" font-size="11.5" fill="var(--cds-text-secondary)">Útočník hází útočné kostky, obránce</text><text x="74" y="218" font-size="11.5" fill="var(--cds-text-secondary)">hází obranné.</text></g><g><rect x="60" y="468" width="260" height="96" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="74" y="494" font-weight="600" fill="var(--cds-text-primary)">3 · Náboje</text><text x="74" y="514" font-size="11.5" fill="var(--cds-text-secondary)">Každý náboj použiješ jednou na</text><text x="74" y="530" font-size="11.5" fill="var(--cds-text-secondary)">schopnost. Nevyužitý náboj smaže</text><text x="74" y="546" font-size="11.5" fill="var(--cds-text-secondary)">hrdino
