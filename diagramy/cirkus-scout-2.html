<figure class="schema"><div class="schema-plocha"><svg viewBox="0 0 760 436" role="img" aria-label="Tah ve hře Cirkus: předvést show, zlanařit, nebo obojí, a kontrola konce kola" font-size="13"><defs><marker id="tah-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="var(--cds-text-primary)">V tahu zvolíš jednu ze tří akcí a po ní zkontroluješ, jestli kolo neskončilo</text><g><rect x="130" y="56" width="500" height="76" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="146" y="80" font-weight="600" fill="var(--cds-text-primary)">1 · Podívej se na stůl</text><text x="146" y="98" font-size="11.5" fill="var(--cds-text-secondary)">Když na stole leží sestava, vybereš si jednu ze tří akcí. Když je stůl prázdný,</text><text x="146" y="114" font-size="11.5" fill="var(--cds-text-secondary)">můžeš jen předvést show.</text></g><g fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"><path d="M380 132V150"></path><path d="M132 150H628"></path><path d="M132 150V176" marker-end="url(#tah-arrow)"></path><path d="M380 150V176" marker-end="url(#tah-arrow)"></path><path d="M628 150V176" marker-end="url(#tah-arrow)"></path></g><g><rect x="24" y="176" width="216" height="100" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="40" y="200" font-weight="600" fill="var(--cds-text-primary)">Předvést show</text><text x="40" y="218" font-size="11.5" fill="var(--cds-text-secondary)">Zahraješ sestavu z karet vedle</text><text x="40" y="234" font-size="11.5" fill="var(--cds-text-secondary)">sebe, která přebije sestavu na</text><text x="40" y="250" font-size="11.5" fill="var(--cds-text-secondary)">stole. Starou sestavu si vezmeš</text><text x="40" y="266" font-size="11.5" fill="var(--cds-text-secondary)">a každá karta je bod.</text></g><g><rect x="272" y="176" width="216" height="100" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="288" y="200" font-weight="600" fill="var(--cds-text-primary)">Zlanařit</text><text x="288" y="218" font-size="11.5" fill="var(--cds-text-secondary)">Vezmeš krajní kartu ze stolu do</text><text x="288" y="234" font-size="11.5" fill="var(--cds-text-secondary)">ruky a vložíš ji kamkoli. Hráč,</text><text x="288" y="250" font-size="11.5" fill="var(--cds-text-secondary)">který sestavu zahrál, dostane</text><text x="288" y="266" font-size="11.5" fill="var(--cds-text-secondary)">žeton.</text></g><g><rect x="520" y="176" width="216" height="100" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="536" y="200" font-weight="600" fill="var(--cds-text-primary)">Zlanařit a předvést</text><text x="536" y="218" font-size="11.5" fill="var(--cds-text-secondary)">Smíš jednou za kolo: nejdřív</text><text x="536" y="234" font-size="11.5" fill="var(--cds-text-secondary)">zlanařit, hned potom předvést</text><text x="536" y="250" font-size="11.5" fill="var(--cds-text-secondary)">show. Žeton tím spotřebuješ.</text></g><g fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"><path d="M132 276V296"></path><path d="M380 276V296"></path><path d="M628 276V296"></path><path d="M132 296H628"></path><path d="M380 296V316" marker-end="url(#tah-arrow)"></path></g><g><polygon points="272,352 380,316 488,352 380,388" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></polygon><text x="380" y="356" text-anchor="middle" fill="var(--cds-text-primary)">Skončilo kolo?</text></g><text x="380" y="404" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">Kolo končí, když někdo vyloží poslední kartu, nebo když všichni</text><text x="380" y="420" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">ostatní zlanaří a řada se vrátí k tomu, kdo sestavu zahrál.</text><g fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"><path d="M272 352H240" marker-end="url(#tah-arrow)"></path><path d="M488 352H520" marker-end="url(#tah-arrow)"></path></g><text x="256" y="344" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">ano</text><text x="504" y="344" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">ne</text><g><rect x="24" y="316" width="216" height="72" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="40" y="340" font-weight="600" fill="var(--cds-text-primary)">Spočítej body</text><text x="40" y="358" font-size="11.5" fill="var(--cds-text-secondary)">Dostaneš body za karty a žetony,</text><text x="40" y="374" font-size="11.5" fill="var(--cds-text-secondary)">ale odečteš karty v ruce.</text></g><g><rect x="520" y="316" width="216" height="72" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="536" y="340" font-weight="600" fill="var(--cds-text-primary)">Hraje další hráč</text><text x="536" y="358" font-size="11.5" fill="var(--cds-text-secondary)">Na tahu je další hráč v pořadí.</text></g></svg></div><figcaption>tah · show, zlanařit nebo obojí</figcaption></figure>
