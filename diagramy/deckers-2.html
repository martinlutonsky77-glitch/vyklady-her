(--cds-chart-axis)" stroke-width="1.25" marker-end="url(#deckers-2-a)"></path><path d="M488 108H520" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" marker-end="url(#deckers-2-a)"></path><path d="M628 152V196" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" marker-end="url(#deckers-2-a)"></path><g><rect x="520" y="196" width="216" height="88" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="536" y="220" font-weight="600" fill="var(--cds-text-primary)">4 · Obnova</text><text x="536" y="238" font-size="11.5" fill="var(--cds-text-secondary)">Odhodíš cíl, zamícháš odhazovací</text><text x="536" y="254" font-size="11.5" fill="var(--cds-text-secondary)">balíček a dobereš 5 karet.</text></g><g><polygon points="272,240 380,196 488,240 380,284" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></polygon><text x="380" y="236" text-anchor="middle" fill="var(--cds-text-primary)">Byl vyhodnocen</text><text x="380" y="252" text-anchor="middle" fill="var(--cds-text-primary)">poslední zlatý cíl?</text></g><path d="M520 240H488" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" marker-end="url(#deckers-2-a)"></path><path d="M272 240H240" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" marker-end="url(#deckers-2-a)"></path><text x="256" y="232" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">ano</text><g><rect x="24" y="196" width="216" height="88" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="40" y="220" font-weight="600" fill="var(--cds-text-primary)">Konec hry</text><text x="40" y="238" font-size="11.5" fill="var(--cds-text-secondary)">Hra končí podle rubu karty cíle.</text></g><path d="M380 284V312H8V108H24" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" marker-end="url(#deckers-2-a)"></path><text x="396" y="306" font-size="11.5" fill="var(--cds-text-secondary)">ne, začne další cyklus</text><text x="24" y="350" font-weight="600" fill="var(--cds-text-primary)">Tah deckera v příkazové fázi (třikrát za cyklus)</text><g><rect x="24" y="366" width="164" height="120" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="40" y="390" font-weight="600" fill="var(--cds-text-primary)">Zrození jisker</text><text x="40" y="408" font-size="11.5" fill="var(--cds-text-secondary)">Splníš efekty začátku</text><text x="40" y="424" font-size="11.5" fill="var(--cds-text-secondary)">tahu a pokládáš jiskry</text><text x="40" y="440" font-size="11.5" fill="var(--cds-text-secondary)">po jedné. V prvním tahu</text><text x="40" y="456" font-size="11.5" fill="var(--cds-text-secondary)">hry se nerodí.</text></g><g><rect x="204" y="366" width="164" height="120" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="220" y="390" font-weight="600" fill="var(--cds-text-primary)">Akce</text><text x="220" y="408" font-size="11.5" fill="var(--cds-text-secondary)">Hraješ karty jako sady</text><text x="220" y="424" font-size="11.5" fill="var(--cds-text-secondary)">symbolů a platíš jimi</text><text x="220" y="440" font-size="11.5" fill="var(--cds-text-secondary)">akce. Přeplacené</text><text x="220" y="456" font-size="11.5" fill="var(--cds-text-secondary)">příkazy propadají.</text></g><g><rect x="384" y="366" width="164" height="120" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="400" y="390" font-weight="600" fill="var(--cds-text-primary)">Konec tahu</text><text x="400" y="408" font-size="11.5" fill="var(--cds-text-secondary)">Odhodíš ruku, jednu</text><text x="400" y="424" font-size="11.5" fill="var(--cds-text-secondary)">kartu si smíš nechat</text><text x="400" y="440" font-size="11.5" fill="var(--cds-text-secondary)">(ne v posledním tahu</text><text x="400" y="456" font-size="11.5" fill="var(--cds-text-secondary)">cyklu).</text></g><g><rect x="564" y="366" width="172" height="120" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="580" y="390" font-weight="600" fill="var(--cds-text-primary)">Dobrání</text><text x="580" y="408" font-size="11.5" fill="var(--cds-text-secondary)">Dobereš 5 karet a</text><text x="580" y="424" font-size="11.5" fill="var(--cds-text-secondary)">doplníš prázdná místa</text><text x="580" y="440" font-size="11.5" fill="var(--cds-text-secondary)">v oblasti vylepšení.</text></g><path d="M188 426H204" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" marker-end="url(#deckers-2-a)"></path><path d="M368 426H384" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" marker-end="url(#deckers-2-a)"></path><path d="M548 426H564" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" marker-end="url(#deckers-2-a)"></path><g><rect x="24" y="506" width="712" height="64" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="40" y="530" font-weight="600" fill="var(--cds-text-primary)">Prohra</text><text x="40" y="548" font-size="11.5" fill="var(--cds-text-secondary)">Máš položit jiskru nebo strážce a v zásobě žádný není. Nebo nesplníš zlatý cíl.</text></g></svg></div><figcaption>cyklus ve 4 fázích, tah deckera a jiskry</figcaption></figure>
