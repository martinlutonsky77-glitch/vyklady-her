" y="464" font-size="11.5" fill="var(--cds-text-primary)">akce a pak se všechny vrátí. Je</text><text x="284" y="480" font-size="11.5" fill="var(--cds-text-primary)">to celý tah.</text></g><g><rect x="508" y="284" width="224" height="216" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><circle cx="530" cy="308" r="11" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="1.25"></circle><text x="530" y="312" text-anchor="middle" font-size="12" font-weight="600" fill="var(--cds-text-primary)">6</text><text x="550" y="312" font-weight="600" fill="var(--cds-text-primary)">Konec hry</text><polygon points="522,362 552,336 582,362" fill="var(--cds-chart-categorical-5)" fill-opacity="0.35" stroke="var(--cds-chart-categorical-5)" stroke-width="1.25"></polygon><rect x="528" y="362" width="48" height="26" rx="2" fill="var(--cds-chart-categorical-5)" fill-opacity="0.2" stroke="var(--cds-chart-categorical-5)" stroke-width="1.25"></rect><text x="552" y="380" text-anchor="middle" font-size="15" font-weight="600" fill="var(--cds-text-primary)">6</text><text x="608" y="366" font-weight="600" fill="var(--cds-text-primary)">obydlí</text><text x="524" y="416" font-size="11.5" fill="var(--cds-text-primary)">Hra končí, když někdo postaví 6.</text><text x="524" y="432" font-size="11.5" fill="var(--cds-text-primary)">obydlí nebo se vyloží poslední</text><text x="524" y="448" font-size="11.5" fill="var(--cds-text-primary)">území. Každý hráč pak odehraje</text><text x="524" y="464" font-size="11.5" fill="var(--cds-text-primary)">ještě jeden tah.</text></g></svg></div><figcaption>První tahy v šesti panelech</figcaption></figure>
