-secondary)">pět nových.</text></g><g fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"><path d="M240 100H272" marker-end="url(#tah-arrow)"></path><path d="M488 100H520" marker-end="url(#tah-arrow)"></path><path d="M628 144V176" marker-end="url(#tah-arrow)"></path></g><g><rect x="520" y="176" width="216" height="88" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="536" y="200" font-weight="600" fill="var(--cds-text-primary)">4 · Doplň nabídku</text><text x="536" y="218" font-size="11.5" fill="var(--cds-text-secondary)">Nabídku podzemí doplníš na šest</text><text x="536" y="234" font-size="11.5" fill="var(--cds-text-secondary)">karet.</text></g><g fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"><path d="M520 220H488" marker-end="url(#tah-arrow)"></path></g><g><polygon points="272,220 380,184 488,220 380,256" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></polygon><text x="380" y="216" text-anchor="middle" fill="var(--cds-text-primary)">Má nová karta symbol</text><text x="380" y="232" text-anchor="middle" fill="var(--cds-text-primary)">dračího útoku?</text></g><g fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"><path d="M272 220H240" marker-end="url(#tah-arrow)"></path><path d="M380 256V304" marker-end="url(#tah-arrow)"></path></g><text x="256" y="212" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">ano</text><text x="396" y="284" font-size="11.5" fill="var(--cds-text-secondary)">ne</text><g><rect x="24" y="172" width="216" height="132" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="40" y="196" font-weight="600" fill="var(--cds-text-primary)">Útok draka</text><text x="40" y="214" font-size="11.5" fill="var(--cds-text-secondary)">Kostičky z pole BŘINK! jdou do</text><text x="40" y="230" font-size="11.5" fill="var(--cds-text-secondary)">pytlíku. Táhneš tolik kostiček,</text><text x="40" y="246" font-size="11.5" fil
