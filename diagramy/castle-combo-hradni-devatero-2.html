ístě.</text></g><g><rect x="24" y="224" width="676" height="52" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="40" y="248" font-weight="600" fill="var(--cds-text-primary)">3 · Provedeš schopnost karty</text><text x="40" y="266" font-size="11.5" fill="var(--cds-text-secondary)">Schopnost proběhne hned a nová karta se počítá i do své schopnosti.</text></g><g><rect x="24" y="300" width="676" height="52" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="40" y="324" font-weight="600" fill="var(--cds-text-primary)">4 · Přesuneš Messenger a doplníš nabídku</text><text x="40" y="342" font-size="11.5" fill="var(--cds-text-secondary)">Messenger jde podle ikony karty a nabídka se doplní na 3 karty.</text></g><g><rect x="24" y="376" width="676" height="52" rx="8" fill="var(--cds-chart-categorical-5)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-5)" stroke-width="2"></rect><text x="40" y="400" font-weight="600" fill="var(--cds-text-primary)">Další hráč, nebo konec hry</text><text x="40" y="418" font-size="11.5" fill="var(--cds-text-secondary)">Má-li každý 9 karet, hra končí a počítají se body. Jinak hraje další hráč znovu od kroku 1.</text></g></svg></div><figcaption>tah · klíč, nákup, schopnost, posel</figcaption></figure>
