<figure class="schema"><div class="schema-plocha"><svg viewBox="0 0 760 478" role="img" aria-label="Den v Olejovkách má tři fáze: Na moři, Na pevnině a Konec dne; po posledním dni měsíce se kontrolují cíle" font-size="13"><defs><marker id="ol-sipka" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="var(--cds-text-primary)">Každý den má tři fáze a po posledním dni měsíce se kontrolují cíle</text><g fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"><path d="M252 126H268" marker-end="url(#ol-sipka)"></path><path d="M492 126H508" marker-end="url(#ol-sipka)"></path><path d="M620 196V220H560V245" marker-end="url(#ol-sipka)"></path><path d="M430 290H396" marker-end="url(#ol-sipka)"></path><path d="M140 262V196" marker-end="url(#ol-sipka)"></path><path d="M560 335V370" marker-end="url(#ol-sipka)"></path></g><rect x="28" y="56" width="224" height="140" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="40" y="78" font-weight="600" fill="var(--cds-text-primary)">1 · Na moři</text><text x="40" y="96" font-size="11.5" fill="var(--cds-text-secondary)">Za každou loď a za Otevřené</text><text x="40" y="112" font-size="11.5" fill="var(--cds-text-secondary)">moře lížeš 5 žetonů. Loď si</text><text x="40" y="128" font-size="11.5" fill="var(--cds-text-secondary)">nechá tolik, kolik má úlovek.</text><text x="40" y="144" font-size="11.5" fill="var(--cds-text-secondary)">Zbytek jde do otevřené vody pod</text><text x="40" y="160" font-size="11.5" fill="var(--cds-text-secondary)">ní.</text><rect x="268" y="56" width="224" height="140" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="280" y="78" font-weight="600" fill="var(--cds-text-primary)">2 · Na pevnině</text><text x="280" y="96" font-size="11.5" fill="var(--cds-text-secondary)">Úlovek prodáváš na trhu měsíce.</text><text x="280" y="112" font-size="11.5" fill="var(--cds-text-secondary)">Prodané žetony mizí ze sáčku</text><text x="280" y="128" font-size="11.5" fill="var(--cds-text-secondary)">natrvalo. Kupuješ lodě a</text><text x="280" y="144" font-size="11.5" fill="var(--cds-text-secondary)">vylepšení, vylepšení platíš</text><text x="280" y="160" font-size="11.5" fill="var(--cds-text-secondary)">úlovkem.</text><rect x="508" y="56" width="224" height="140" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="520" y="78" font-weight="600" fill="var(--cds-text-primary)">3 · Konec dne</text><text x="520" y="96" font-size="11.5" fill="var(--cds-text-secondary)">Zaplatíš údržbu lodí; loď, za</text><text x="520" y="112" font-size="11.5" fill="var(--cds-text-secondary)">kterou nezaplatíš, vrátíš. Pak</text><text x="520" y="128" font-size="11.5" fill="var(--cds-text-secondary)">za každý druh v otevřené vodě</text><text x="520" y="144" font-size="11.5" fill="var(--cds-text-secondary)">přidáš do sáčku počet minus 1</text><text x="520" y="160" font-size="11.5" fill="var(--cds-text-secondary)">kusů a otevřenou vodu vrátíš do</text><text x="520" y="176" font-size="11.5" fill="var(--cds-text-secondary)">sáčku.</text><polygon points="430,290 560,245 690,290 560,335" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></polygon><text x="560" y="294" text-anchor="middle" fill="var(--cds-text-primary)">Skončil měsíc?</text><text x="413" y="282" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">ne</text><text x="568" y="358" font-size="11.5" fill="var(--cds-text-secondary)">ano</text><rect x="28" y="262" width="368" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="40" y="284" font-weight="600" fill="var(--cds-text-primary)">Začne další den</text><text x="40" y="302" font-size="11.5" fill="var(--cds-text-secondary)">Hraje se znovu od fáze Na moři.</text><rect x="28" y="370" width="704" height="84" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="40" y="392" font-weight="600" fill="var(--cds-text-primary)">Kontrola cílů měsíce</text><text x="40" y="410" font-size="11.5" fill="var(--cds-text-secondary)">Splníš cíle: obvykle částku peněz a úroveň udržitelnosti, někdy i počet lodí nebo vylepšení. Moře nesmíš</text><text x="40" y="426" font-size="11.5" fill="var(--cds-text-secondary)">vylovit, protože se živočichové rozmnožují jen z otevřené vody.</text></svg></div><figcaption>Den ve třech fázích · cíle měsíce</figcaption></figure>
