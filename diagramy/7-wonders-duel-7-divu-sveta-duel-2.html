secondary)">Některé divy dají druhý tah.</text></g><g><rect x="520" y="148" width="216" height="104" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="536" y="172" font-weight="600" fill="var(--cds-text-primary)">2c · Odhodíte kartu</text><text x="536" y="190" font-size="11.5" fill="var(--cds-text-secondary)">Vezmete si 2 mince plus 1</text><text x="536" y="206" font-size="11.5" fill="var(--cds-text-secondary)">za každou svou žlutou kartu.</text><text x="536" y="222" font-size="11.5" fill="var(--cds-text-secondary)">Kartu odložíte lícem dolů.</text></g><g><rect x="120" y="290" width="360" height="48" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="136" y="314" font-weight="600" fill="var(--cds-text-primary)">3 · Odkryjete uvolněné karty</text><text x="136" y="332" font-size="11.5" fill="var(--cds-text-secondary)">Odkryjete všechny karty, které se uvolnily.</text></g><g><polygon points="120,408 300,364 480,408 300,452" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></polygon><text x="300" y="404" text-anchor="middle" fill="var(--cds-text-primary)">Má někdo vojenskou</text><text x="300" y="420" text-anchor="middle" fill="var(--cds-text-primary)">nebo vědeckou převahu?</text></g><g><rect x="520" y="364" width="216" height="88" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="536" y="388" font-weight="600" fill="var(--cds-text-primary)">Hra končí hned</text><text x="536" y="406" font-size="11.5" fill="var(--cds-text-secondary)">Vojsko: figurka stojí na poli</text><text x="536" y="422" font-size="11.5" fill="var(--cds-text-secondary)">hlavního města soupeře.</text><text x="536" y="438" font-size="11.5" fill="var(--cds-text-secondary)">Věda: šest různých symbolů.</text></g><g><polygon points="120,520 300,476 480,520 300,564" fill="none" stroke="var(--cds-chart-ax
