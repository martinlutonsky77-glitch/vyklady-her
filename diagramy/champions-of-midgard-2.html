<figure class="schema"><div class="schema-plocha"><svg viewBox="0 0 760 560" role="img" aria-label="Kolo Champions of Midgard má pět fází" font-size="13"><defs><marker id="champions-of-midgard-2-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="var(--cds-text-primary)">Kolo má pět fází a po osmém kole vyhrává nejvíc Glory</text><g fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"><path d="M362 124V148" marker-end="url(#champions-of-midgard-2-a)"></path><path d="M362 216V240" marker-end="url(#champions-of-midgard-2-a)"></path><path d="M362 308V332" marker-end="url(#champions-of-midgard-2-a)"></path><path d="M362 432V456" marker-end="url(#champions-of-midgard-2-a)"></path><path d="M700 498H732V90H700" marker-end="url(#champions-of-midgard-2-a)"></path></g><g><rect x="24" y="56" width="676" height="68" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="40" y="80" font-weight="600" fill="var(--cds-text-primary)">1 · Příprava kola</text><text x="40" y="98" font-size="11.5" fill="var(--cds-text-secondary)">Odhalíš trolla, 2 draugry, Journeys, Rune, nestvůry a obchodní loď. Na kováře přidáš kostky a do</text><text x="40" y="114" font-size="11.5" fill="var(--cds-text-secondary)">udírny jídlo.</text></g><g><rect x="24" y="148" width="676" height="68" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="40" y="172" font-weight="600" fill="var(--cds-text-primary)">2 · Umístění dělníků</text><text x="40" y="190" font-size="11.5" fill="var(--cds-text-secondary)">Po směru hodin klade každý jednoho dělníka. Hnědé a modré lokace se vyhodnotí hned, červené jsou</text><text x="40" y="206" font-size="11.5" fill="var(--cds-text-secondary)">rezervovaný boj.</text></g><g><rect x="24" y="240" width="676" height="68" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="40" y="264" font-weight="600" fill="var(--cds-text-primary)">3 · Přiřazení válečníků</text><text x="40" y="282" font-size="11.5" fill="var(--cds-text-secondary)">Kdo má bojové místo, přiřadí kostky na trolla, draugra nebo Longship. Nepřiřazené kostky z Hunting</text><text x="40" y="298" font-size="11.5" fill="var(--cds-text-secondary)">Grounds jdou lovit.</text></g><g><rect x="24" y="332" width="676" height="100" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="40" y="356" font-weight="600" fill="var(--cds-text-primary)">4 · Boj na zemi i na moři</text><text x="40" y="374" font-size="11.5" fill="var(--cds-text-secondary)">Nejdřív se loví, pak se bojuje s trollem, s draugry vlevo a vpravo a nakonec na Journeys</text><text x="40" y="390" font-size="11.5" fill="var(--cds-text-secondary)">zleva doprava. V každém kole boje hodíš kostkami, za Favor smíš přehodit a pak spočítáš</text><text x="40" y="406" font-size="11.5" fill="var(--cds-text-secondary)">zásahy a ztráty kostek. Na Journey se nejdřív odhalí karta Journey, pak nakrmíš posádku</text><text x="40" y="422" font-size="11.5" fill="var(--cds-text-secondary)">a nakonec bojuješ s nestvůrou.</text></g><g><rect x="24" y="456" width="676" height="84" rx="8" fill="var(--cds-chart-categorical-5)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-5)" stroke-width="2"></rect><text x="40" y="480" font-weight="600" fill="var(--cds-text-primary)">5 · Úklid</text><text x="40" y="498" font-size="11.5" fill="var(--cds-text-secondary)">Dělníci se vrátí. Neporažení draugrové a Journeys odpadnou, neporažená nestvůra dostane 1 Coin.</text><text x="40" y="514" font-size="11.5" fill="var(--cds-text-secondary)">Přežil-li troll, dostane každý 1 Blame. Po osmém kole hra končí a vyhrává nejvíc Glory,</text><text x="40" y="530" font-size="11.5" fill="var(--cds-text-secondary)">jinak začíná další kolo krokem 1.</text></g></svg></div><figcaption>kolo v 5 fázích, kolo boje a moře</figcaption></figure>
