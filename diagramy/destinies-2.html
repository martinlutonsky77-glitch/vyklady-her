<figure class="schema"><div class="schema-plocha"><svg viewBox="0 0 760 488" role="img" aria-label="Tah v Destinies ve třech krocích, test na místě a finále osudu" font-size="13"><defs><marker id="tah-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="24" y="32" font-size="15" font-weight="600" fill="var(--cds-text-primary)">Tah má tři kroky a vede k finále osudu</text><g><rect x="24" y="52" width="216" height="144" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="38" y="78" font-weight="600" fill="var(--cds-text-primary)">1 · Začátek tahu</text><text x="38" y="98" font-size="11.5" fill="var(--cds-text-secondary)">Obnovíš 1 kostku úsilí do</text><text x="38" y="114" font-size="11.5" fill="var(--cds-text-secondary)">zásoby. Tady se spouští</text><text x="38" y="130" font-size="11.5" fill="var(--cds-text-secondary)">většina událostí.</text></g><g><rect x="272" y="52" width="216" height="144" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="286" y="78" font-weight="600" fill="var(--cds-text-primary)">2 · Pohyb</text><text x="286" y="98" font-size="11.5" fill="var(--cds-text-secondary)">Posuneš se až o 2 díly</text><text x="286" y="114" font-size="11.5" fill="var(--cds-text-secondary)">kolmo, nebo zůstaneš. Na</text><text x="286" y="130" font-size="11.5" fill="var(--cds-text-secondary)">neprozkoumaném dílu se</text><text x="286" y="146" font-size="11.5" fill="var(--cds-text-secondary)">zastavíš a prozkoumáš ho v</text><text x="286" y="162" font-size="11.5" fill="var(--cds-text-secondary)">aplikaci.</text></g><g><rect x="520" y="52" width="216" height="144" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="534" y="78" font-weight="600" fill="var(--cds-text-primary)">3 · Návštěva místa</text><text x="534" y="98" font-size="11.5" fill="var(--cds-text-secondary)">Navštívíš jedno místo na</text><text x="534" y="114" font-size="11.5" fill="var(--cds-text-secondary)">svém dílu. Každou možnost</text><text x="534" y="130" font-size="11.5" fill="var(--cds-text-secondary)">smíš za tah jednou:</text><text x="534" y="146" font-size="11.5" fill="var(--cds-text-secondary)">rozhovor, test, sken</text><text x="534" y="162" font-size="11.5" fill="var(--cds-text-secondary)">předmětu, sken osudu,</text><text x="534" y="178" font-size="11.5" fill="var(--cds-text-secondary)">obchod.</text></g><g><rect x="24" y="260" width="340" height="96" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="38" y="286" font-weight="600" fill="var(--cds-text-primary)">Test (jedna z možností místa)</text><text x="38" y="306" font-size="11.5" fill="var(--cds-text-secondary)">Hodíš obě hlavní kostky a libovolné kostky</text><text x="38" y="322" font-size="11.5" fill="var(--cds-text-secondary)">úsilí, ty se vyčerpají. Úspěchy zadáš do</text><text x="38" y="338" font-size="11.5" fill="var(--cds-text-secondary)">aplikace.</text></g><g><rect x="396" y="260" width="340" height="96" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="410" y="286" font-weight="600" fill="var(--cds-text-primary)">Finále</text><text x="410" y="306" font-size="11.5" fill="var(--cds-text-secondary)">Smíš ho spustit na místě z karty osudu. Trvá</text><text x="410" y="322" font-size="11.5" fill="var(--cds-text-secondary)">několik tahů, nejde zastavit ani vrátit. Vyhrává</text><text x="410" y="338" font-size="11.5" fill="var(--cds-text-secondary)">první, kdo ho dokončí.</text></g><g><rect x="24" y="384" width="340" height="80" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="38" y="410" font-weight="600" fill="var(--cds-text-primary)">Tah končí</text><text x="38" y="430" font-size="11.5" fill="var(--cds-text-secondary)">Zařízení se předá dalšímu hráči a začíná jeho</text><text x="38" y="446" font-size="11.5" fill="var(--cds-text-secondary)">tah.</text></g><g fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"><path d="M244 124H272" marker-end="url(#tah-arrow)"></path><path d="M492 124H520" marker-end="url(#tah-arrow)"></path><path d="M628 196V224H194V260" marker-end="url(#tah-arrow)"></path><path d="M628 224V260" marker-end="url(#tah-arrow)"></path><path d="M194 356V384" marker-end="url(#tah-arrow)"></path></g><text x="200" y="218" font-size="11.5" fill="var(--cds-text-secondary)">zvolíš test</text><text x="620" y="246" text-anchor="end" font-size="11.5" fill="var(--cds-text-secondary)">spustíš finále na místě z karty osudu</text></svg></div><figcaption>Tah ve třech krocích · test · finále</figcaption></figure>
