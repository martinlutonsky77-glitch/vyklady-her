00" fill="var(--cds-text-primary)">Obnovíš kostku úsilí</text><rect x="284" y="98" width="192" height="28" rx="6" fill="var(--cds-chart-categorical-3)" fill-opacity="0.25" stroke="var(--cds-chart-categorical-3)" stroke-width="1.25"></rect><text x="380" y="117" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">1 kostka úsilí</text><text x="282" y="146" font-size="11.5" fill="var(--cds-text-primary)">Na začátku tahu vezmeš 1</text><text x="282" y="162" font-size="11.5" fill="var(--cds-text-primary)">vyčerpanou kostku úsilí do</text><text x="282" y="178" font-size="11.5" fill="var(--cds-text-primary)">zásoby. Aplikace tady</text><text x="282" y="194" font-size="11.5" fill="var(--cds-text-primary)">případně ohlásí událost.</text></g><g><rect x="508" y="52" width="224" height="198" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><circle cx="530" cy="76" r="11" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="1.25"></circle><text x="530" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="var(--cds-text-primary)">3</text><text x="550" y="80" font-weight="600" fill="var(--cds-text-primary)">Pohneš se</text><rect x="524" y="98" width="192" height="28" rx="6" fill="var(--cds-chart-categorical-4)" fill-opacity="0.25" stroke="var(--cds-chart-categorical-4)" stroke-width="1.25"></rect><text x="620" y="117" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">až 2 díly</text><text x="522" y="146" font-size="11.5" fill="var(--cds-text-primary)">Posuneš se nejvýš o 2 díly.</text><text x="522" y="162" font-size="11.5" fill="var(--cds-text-primary)">Vstoupíš-li na neprozkoumaný</text><text x="522" y="178" font-size="11.5" fill="var(--cds-text-primary)">díl, zastavíš se a prozkoumáš</text><text x="522" y="194" font-size="11.5" fill="var(--cds-text-primary)">ho v aplikaci.</text></g><g><rect x="28" y="266" width="224" height="198" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><circle cx="50" cy="290" r="11" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="1.25"></circle><text x="50" y="294" text-anchor="middle" font-size="12" font-weight="600" fill="var(--cds-text-primary)">4</text><text x="70" y="294" font-weight="600" fill="var(--cds-text-primary)">Vybereš místo</text><rect x="44" y="312" width="192" height="28" rx="6" fill="var(--cds-chart-categorical-5)" fill-opacity="0.25" stroke="var(--cds-chart-categorical-5)" stroke-width="1.25"></rect><text x="140" y="331" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">místo na dílu</text><text x="42" y="360" font-size="11.5" fill="var(--cds-text-primary)">Navštívíš jedno místo na svém</text><text x="42" y="376" font-size="11.5" fill="var(--cds-text-primary)">dílu, například si promluvíš</text><text x="42" y="392" font-size="11.5" fill="var(--cds-text-primary)">s postavou. Každou možnost</text><text x="42" y="408" font-size="11.5" fill="var(--cds-text-primary)">místa smíš za tah použít</text><text x="42" y="424" font-size="11.5" fill="var(--cds-text-primary)">jednou.</text></g><g><rect x="268" y="266" width="224" height="198" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><circle cx="290" cy="290" r="11" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="1.25"></circle><text x="290" y="294" text-anchor="middle" font-size="12" font-weight="600" fill="var(--cds-text-primary)">5</text><text x="310" y="294" font-weight="600" fill="var(--cds-text-primary)">Test</text><rect x="284" y="312" width="192" height="28" rx="6" fill="var(--cds-chart-categorical-6)" fill-opacity="0.25" stroke="var(--cds-chart-categorical-6)" stroke-width="1.25"></rect><text x="380" y="331" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">2 hlavní kostky a úsilí</text><text x="282" y="360" font-size="11.5" fill="var(--cds-text-primary)">Hodíš oběma hlavními kostkami</text><text x="282" y="376" font-size="11.5" fill="var(--cds-text-primary)">a chceš-li, i kostkami úsilí.</text><text x="282" y="392" font-size="11.5" fill="var(--cds-text-primary)">Spočítáš úspěchy a zadáš je</text><text x="282" y="408" font-size="11.5" fill="var(--cds-text-primary)">do aplikace.</text></g><g><rect x="508" y="266" width="224" height="198" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><circle cx="530" cy="290" r="11" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="1.25"></circle><text x="530" y="294" text-anchor="middle" font-size="12" font-weight="600" fill="var(--cds-text-primary)">6</text><text x="550" y="294" font-weight="600" fill="var(--cds-text-primary)">Výsledek a finále</text><rect x="524" y="312" width="192" height="28" rx="6" fill="var(--cds-chart-categorical-2)" fill-opacity="0.25" stroke="var(--cds-chart-categorical-2)" stroke-width="1.25"></rect><text x="620" y="331" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">zkušenosti a předměty</text><text x="522" y="360" font-size="11.5" fill="var(--cds-text-primary)">Za test získáš zkušenosti,</text><text x="522" y="376" font-size="11.5" fill="var(--cds-text-primary)">předměty nebo mince. Na</text><text x="522" y="392" font-size="11.5" fill="var(--cds-text-primary)">místě z karty osudu smíš</text><text x="522" y="408" font-size="11.5" fill="var(--cds-text-primary)">spustit finále. Vyhraješ,</text><text x="522" y="424" font-size="11.5" fill="var(--cds-text-primary)">když ho dokončíš první.</text></g></svg></div><figcaption>První tahy v šesti panelech</figcaption></figure>
