ds-text-primary)">Směna a najímání</text><text x="190" y="221" font-size="11.5" fill="var(--cds-text-secondary)">Královský sklad směňuje suroviny, Dílna najímá učedníky a dává karty budov.</text></g><g><rect x="24" y="244" width="712" height="56" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="38" y="277" font-weight="600" fill="var(--cds-text-primary)">Zásahy do hry</text><text x="190" y="267" font-size="11.5" fill="var(--cds-text-secondary)">Na Rynku zajímáš služebníky, ve Strážnici je vsazuješ do vězení a osvobozuješ.</text><text x="190" y="285" font-size="11.5" fill="var(--cds-text-secondary)">U Výběrčího daní vybereš mince z pole, na Černém trhu získáš surovinu, učedníka nebo kartu.</text></g><g><rect x="24" y="308" width="712" height="40" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="38" y="333" font-weight="600" fill="var(--cds-text-primary)">Stavba a body</text><text x="190" y="333" font-size="11.5" fill="var(--cds-text-secondary)">Na Radnici stavíš budovy a pracuješ na katedrále. Služebník tu zůstane do konce.</text></g><g fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"><path d="M566 126V146" marker-end="url(#m1)"></path><path d="M194 350V370" marker-end="url(#m1)"></path><path d="M366 88H394" marker-end="url(#m1)"></path></g><g><rect x="24" y="372" width="340" height="72" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="38" y="396" font-weight="600" fill="var(--cds-text-primary)">3 · Hraje další hráč</text><text x="38" y="414" font-size="11.5" fill="var(--cds-text-secondary)">Hráči se střídají po směru hodin.</text><text x="38" y="430" font-size="11.5" fill="var(--cds-text-secondary)">Služebník se sám nevrací na desku.</text></g><g><rect x="396" y="372" width="340" height="88" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="410" y="396" fon
