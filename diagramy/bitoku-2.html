<figure class="schema"><div class="schema-plocha"><svg viewBox="0 0 760 636" role="img" aria-label="Rok v Bitoku má čtyři období, v létě děláte čtyři druhy akcí a body sbíráte několika cestami" font-size="13"><defs><marker id="bi2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="var(--cds-text-primary)">Rok má čtyři období, v létě děláte tahy a body sbíráte několika cestami</text><g><rect x="24" y="60" width="160" height="124" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="40" y="84" font-weight="600" fill="var(--cds-text-primary)">Jaro</text><text x="40" y="102" font-size="11.5" fill="var(--cds-text-secondary)">Doberete karty na 4 a</text><text x="40" y="118" font-size="11.5" fill="var(--cds-text-secondary)">jednu odložíte. Pak</text><text x="40" y="134" font-size="11.5" fill="var(--cds-text-secondary)">sklidíte plody z</text><text x="40" y="150" font-size="11.5" fill="var(--cds-text-secondary)">fialových krystalů.</text></g><g><rect x="212" y="60" width="160" height="124" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="228" y="84" font-weight="600" fill="var(--cds-text-primary)">Léto</text><text x="228" y="102" font-size="11.5" fill="var(--cds-text-secondary)">Střídáte se po tazích.</text><text x="228" y="118" font-size="11.5" fill="var(--cds-text-secondary)">V každém tahu uděláte</text><text x="228" y="134" font-size="11.5" fill="var(--cds-text-secondary)">jednu ze čtyř akcí.</text></g><g><rect x="400" y="60" width="160" height="124" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="416" y="84" font-weight="600" fill="var(--cds-text-primary)">Podzim</text><text x="416" y="102" font-size="11.5" fill="var(--cds-text-secondary)">Určí se nové pořadí.</text><text x="416" y="118" font-size="11.5" fill="var(--cds-text-secondary)">První je ten, kdo má</text><text x="416" y="134" font-size="11.5" fill="var(--cds-text-secondary)">kostku nejvýš v</text><text x="416" y="150" font-size="11.5" fill="var(--cds-text-secondary)">Příbytku Velkého ducha.</text></g><g><rect x="588" y="60" width="160" height="124" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="604" y="84" font-weight="600" fill="var(--cds-text-primary)">Zima</text><text x="604" y="102" font-size="11.5" fill="var(--cds-text-secondary)">Kostky se vrátí na</text><text x="604" y="118" font-size="11.5" fill="var(--cds-text-secondary)">červená místa se svou</text><text x="604" y="134" font-size="11.5" fill="var(--cds-text-secondary)">hodnotou. Vyložené karty</text><text x="604" y="150" font-size="11.5" fill="var(--cds-text-secondary)">se odloží a kopce se</text><text x="604" y="166" font-size="11.5" fill="var(--cds-text-secondary)">doplní.</text></g><g fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"><path d="M184 122H212" marker-end="url(#bi2)"></path><path d="M372 122H400" marker-end="url(#bi2)"></path><path d="M560 122H588" marker-end="url(#bi2)"></path><path d="M668 184V206H104V184" marker-end="url(#bi2)"></path></g><text x="386" y="226" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">Po čtvrté zimě hra končí a počítají se body, jinak začíná další rok.</text><g><rect x="24" y="248" width="712" height="172" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="40" y="272" font-weight="600" fill="var(--cds-text-primary)">Co děláte v létě ve svém tahu</text><rect x="40" y="288" width="164" height="120" rx="6" fill="none" stroke="var(--cds-chart-categorical-1)" stroke-width="1.25"></rect><text x="50" y="308" font-size="12" font-weight="600" fill="var(--cds-text-primary)">Vyložit kartu jókai</text><text x="50" y="326" font-size="11.5" fill="var(--cds-text-secondary)">Odemkne se kostka</text><text x="50" y="342" font-size="11.5" fill="var(--cds-text-secondary)">vedle karty a smíte</text><text x="50" y="358" font-size="11.5" fill="var(--cds-text-secondary)">provést akci karty.</text><rect x="212" y="288" width="164" height="120" rx="6" fill="none" stroke="var(--cds-chart-categorical-2)" stroke-width="1.25"></rect><text x="222" y="308" font-size="12" font-weight="600" fill="var(--cds-text-primary)">Použít kostku</text><text x="222" y="326" font-size="11.5" fill="var(--cds-text-secondary)">Kostku postavíte do</text><text x="222" y="342" font-size="11.5" fill="var(--cds-text-secondary)">oblasti Lesa. Akci lesa</text><text x="222" y="358" font-size="11.5" fill="var(--cds-text-secondary)">smíte, jen když je vaše</text><text x="222" y="374" font-size="11.5" fill="var(--cds-text-secondary)">kostka stejná nebo vyšší</text><text x="222" y="390" font-size="11.5" fill="var(--cds-text-secondary)">než ostatní.</text><rect x="384" y="288" width="164" height="120" rx="6" fill="none" stroke="var(--cds-chart-categorical-3)" stroke-width="1.25"></rect><text x="394" y="308" font-size="12" font-weight="600" fill="var(--cds-text-primary)">Překročit řeku</text><text x="394" y="326" font-size="11.5" fill="var(--cds-text-secondary)">Kostka přejde do kopců</text><text x="394" y="342" font-size="11.5" fill="var(--cds-text-secondary)">Hikaru a klesne o 1,</text><text x="394" y="358" font-size="11.5" fill="var(--cds-text-secondary)">šestka o 3. Vezmete si</text><text x="394" y="374" font-size="11.5" fill="var(--cds-text-secondary)">přízeň Lesa. Jednička</text><text x="394" y="390" font-size="11.5" fill="var(--cds-text-secondary)">řeku nepřekročí.</text><rect x="556" y="288" width="164" height="120" rx="6" fill="none" stroke="var(--cds-chart-categorical-4)" stroke-width="1.25"></rect><text x="566" y="308" font-size="12" font-weight="600" fill="var(--cds-text-primary)">Vynechat tah</text><text x="566" y="326" font-size="11.5" fill="var(--cds-text-secondary)">Smíte až po vyložení</text><text x="566" y="342" font-size="11.5" fill="var(--cds-text-secondary)">3 karet a použití</text><text x="566" y="358" font-size="11.5" fill="var(--cds-text-secondary)">3 kostek. Do konce léta</text><text x="566" y="374" font-size="11.5" fill="var(--cds-text-secondary)">už nehrajete.</text></g><g><rect x="24" y="444" width="712" height="172" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="40" y="468" font-weight="600" fill="var(--cds-text-primary)">Body vznikají skoro všude, vyberte si dvě nebo tři cesty</text><rect x="40" y="484" width="164" height="120" rx="6" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="1.25"></rect><text x="50" y="504" font-size="12" font-weight="600" fill="var(--cds-text-primary)">Karty bitoku</text><text x="50" y="522" font-size="11.5" fill="var(--cds-text-secondary)">Body dává splněná cesta</text><text x="50" y="538" font-size="11.5" fill="var(--cds-text-secondary)">bitoku a poklona bitoku</text><text x="50" y="554" font-size="11.5" fill="var(--cds-text-secondary)">za různé typy karet.</text><rect x="212" y="484" width="164" height="120" rx="6" fill="var(--cds-chart-categorical-2)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-2)" stroke-width="1.25"></rect><text x="222" y="504" font-size="12" font-weight="600" fill="var(--cds-text-primary)">Poutníci</text><text x="222" y="522" font-size="11.5" fill="var(--cds-text-secondary)">Body dávají cesty</text><text x="222" y="538" font-size="11.5" fill="var(--cds-text-secondary)">moudrosti a kameny</text><text x="222" y="554" font-size="11.5" fill="var(--cds-text-secondary)">iwakura. Kámen boduje</text><text x="222" y="570" font-size="11.5" fill="var(--cds-text-secondary)">jen s poutníkem u sebe.</text><rect x="384" y="484" width="164" height="120" rx="6" fill="var(--cds-chart-categorical-3)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-3)" stroke-width="1.25"></rect><text x="394" y="504" font-size="12" font-weight="600" fill="var(--cds-text-primary)">Kodamové</text><text x="394" y="522" font-size="11.5" fill="var(--cds-text-secondary)">Na stupnicích kodamů</text><text x="394" y="538" font-size="11.5" fill="var(--cds-text-secondary)">se bojuje o jezerní</text><text x="394" y="554" font-size="11.5" fill="var(--cds-text-secondary)">poklady. Kodama, který</text><text x="394" y="570" font-size="11.5" fill="var(--cds-text-secondary)">se nepohnul, neboduje.</text><rect x="556" y="484" width="164" height="120" rx="6" fill="var(--cds-chart-categorical-4)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-4)" stroke-width="1.25"></rect><text x="566" y="504" font-size="12" font-weight="600" fill="var(--cds-text-primary)">Karty vidění</text><text x="566" y="522" font-size="11.5" fill="var(--cds-text-secondary)">Splněné karty dávají</text><text x="566" y="538" font-size="11.5" fill="var(--cds-text-secondary)">body, za nesplněné</text><text x="566" y="554" font-size="11.5" fill="var(--cds-text-secondary)">ztratíte 1 až 2 BC.</text></g></svg></div><figcaption>kolo · 4 období, 4 akce v létě, cesty k bodům</figcaption></figure>
