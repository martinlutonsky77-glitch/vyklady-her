</g><g><rect x="512" y="64" width="224" height="84" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="526" y="88" font-weight="600" fill="var(--cds-text-primary)">3 · Vyhodnocení polí</text><text x="526" y="106" font-size="11.5" fill="var(--cds-text-secondary)">Pole se vyhodnotí po směru hodin.</text><text x="526" y="122" font-size="11.5" fill="var(--cds-text-secondary)">Odmítnutá akce pošle kostku</text><text x="526" y="138" font-size="11.5" fill="var(--cds-text-secondary)">mezi nevyužité.</text></g><g><rect x="512" y="196" width="224" height="84" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="526" y="220" font-weight="600" fill="var(--cds-text-primary)">4 · Konference</text><text x="526" y="238" font-size="11.5" fill="var(--cds-text-secondary)">Koná se jen po 3. a 5. kole.</text><text x="526" y="254" font-size="11.5" fill="var(--cds-text-secondary)">Kdo má málo pečetí, ztratí</text><text x="526" y="270" font-size="11.5" fill="var(--cds-text-secondary)">reputaci. Pak se vymění artefakty.</text></g><g><rect x="268" y="196" width="224" height="84" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="282" y="220" font-weight="600" fill="var(--cds-text-primary)">5 · Konec kola</text><text x="282" y="238" font-size="11.5" fill="var(--cds-text-secondary)">Nejlepší alchymista získá bod.</text><text x="282" y="254" font-size="11.5" fill="var(--cds-text-secondary)">Dvojice kostek dá kartu přízně.</text><text x="282" y="270" font-size="11.5" fill="var(--cds-text-secondary)">Přijde nový dobrodruh.</text></g><g><polygon points="24,238 132,194 240,238 132,282" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></polygon><text x="132" y="234" text-anchor="middle" fill="var(--cds-text-primary)">Bylo to</text><text x="132" y="250" text-anchor="middle" fill="var(--cds-text-primary)">šesté kolo?</text></g><text x="142" y="176" font-size="11.5" fill="var(--cds-text-secondary)">ne</text><text x="142" y="304" font-size="11.5" fill="var(--cds-text-secondary)">ano</text><g><rect x="20" y="320" width="224" height="104" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="34" y="344" font-weight="600" fill="var(--cds-text-primary)">Bodování po šestém kole</text><text x="34" y="362" font-size="11.5" fill="var(--cds-text-secondary)">Body dá reputace, artefakty</text><text x="34" y="378" font-size="11.5" fill="var(--cds-text-secondary)">i granty. Pak čtečka odhalí</text><text x="34" y="394" font-size="11.5" fill="var(--cds-text-secondary)">přísady a pečeti body přidají</text><text x="34" y="410" font-size="11.5" fill="var(--cds-text-secondary)">nebo uberou.</text></g></svg></div><figcaption>kolo · 5 kroků a bodování po šestém kole</figcaption></figure>
