a</text><text x="280" y="134" font-size="11.5" fill="var(--cds-text-primary)">svá bojová místa: trolla, draugra,</text><text x="280" y="150" font-size="11.5" fill="var(--cds-text-primary)">Hunting Grounds nebo Longship.</text></g><g><rect x="508" y="52" width="224" height="160" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><circle cx="530" cy="76" r="11" fill="var(--cds-chart-categorical-3)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-3)" stroke-width="1.25"></circle><text x="530" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="var(--cds-text-primary)">3</text><text x="550" y="80" font-weight="600" fill="var(--cds-text-primary)">Hod</text><line x1="520" y1="96" x2="720" y2="96" stroke="var(--cds-chart-categorical-3)" stroke-width="1.25"></line><text x="520" y="118" font-size="11.5" fill="var(--cds-text-primary)">Hoď všemi přiřazenými kostkami. Za</text><text x="520" y="134" font-size="11.5" fill="var(--cds-text-primary)">1 Favor smíš přehodit, kolik</text><text x="520" y="150" font-size="11.5" fill="var(--cds-text-primary)">kostek chceš. Zásah dává 1</text><text x="520" y="166" font-size="11.5" fill="var(--cds-text-primary)">poškození, dvojitý zásah 2.</text></g><g><rect x="28" y="228" width="224" height="160" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><circle cx="50" cy="252" r="11" fill="var(--cds-chart-categorical-4)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-4)" stroke-width="1.25"></circle><text x="50" y="256" text-anchor="middle" font-size="12" font-weight="600" fill="var(--cds-text-primary)">4</text><text x="70" y="256" font-weight="600" fill="var(--cds-text-primary)">Ztráty</text><line x1="40" y1="272" x2="240" y2="272" stroke="var(--cds-chart-categorical-4)" stroke-width="1.25"></line><text x="40" y="294" font-size="11.5" fill="var(--cds-text-primary)">Ztratíš tolik kostek, kolik je</text><text x="40" y="310" font-size="11.5" fill="var(--cds-text-primary)">útok nepřítele mínus štíty. Má-li</text><text x="40" y="326" font-size="11.5" fill="var(--cds-text-primary)">poškození aspoň hodnotu obrany,</text><text x="40" y="342" font-size="11.5" fill="var(--cds-text-primary)">vítězíš. Jinak bojuješ dál, dokud</text><text x="40" y="358" font-size="11.5" fill="var(--cds-text-primary)">máš kostky.</text></g><g><rect x="268" y="228" width="224" height="160" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><circle cx="290" cy="252" r="11" fill="var(--cds-chart-categorical-5)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-5)" stroke-width="1.25"></circle><text x="290" y="256" text-anchor="middle" font-size="12" font-weight="600" fill="var(--cds-text-primary)">5</text><text x="310" y="256" font-weight="600" fill="var(--cds-text-primary)">Plavba</text><line x1="280" y1="272" x2="480" y2="272" stroke="var(--cds-chart-categorical-5)" stroke-width="1.25"></line><text x="280" y="294" font-size="11.5" fill="var(--cds-text-primary)">Na Longship odhal Journey a nakrm</text><text x="280" y="310" font-size="11.5" fill="var(--cds-text-primary)">posádku. U bližších břehů stačí 1</text><text x="280" y="326" font-size="11.5" fill="var(--cds-text-primary)">jídlo na 2 válečníky, u vzdálených</text><text x="280" y="342" font-size="11.5" fill="var(--cds-text-primary)">na 1. Pak bojuj s nestvůrou.</text></g><g><rect x="508" y="228" width="224" height="160" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><circle cx="530" cy="252" r="11" fill="var(--cds-chart-categorical-6)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-6)" stroke-width="1.25"></circle><text x="530" y="256" text-anchor="middle" font-size="12" font-weight="600" fill="var(--cds-text-primary)">6</text><text x="550" y="256" font-weight="600" fill="var(--cds-text-primary)">Úklid</text><line x1="520" y1="272" x2="720" y2="272" stroke="var(--cds-chart-categorical-6)" stroke-width="1.25"></line><text x="520" y=
