2" y="198" font-size="11.5" fill="var(--cds-text-secondary)">a nesmí vytvořit ledge.</text></g><g><rect x="24" y="252" width="330" height="96" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="40" y="276" font-weight="600" fill="var(--cds-text-primary)">Tah končí</text><text x="40" y="294" font-size="11.5" fill="var(--cds-text-secondary)">Hraje další hráč po směru hodin.</text><text x="40" y="310" font-size="11.5" fill="var(--cds-text-secondary)">Po Excavate Blocks se Keys nekontrolují.</text></g><g><polygon points="406,300 571,252 736,300 571,348" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></polygon><text x="571" y="292" text-anchor="middle" fill="var(--cds-text-primary)">Dokončil se Key a váš Block</text><text x="571" y="308" text-anchor="middle" fill="var(--cds-text-primary)">k němu přispěl aspoň jednou face?</text></g><g><rect x="406" y="380" width="330" height="104" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="422" y="404" font-weight="600" fill="var(--cds-text-primary)">Claimnete Key</text><text x="422" y="422" font-size="11.5" fill="var(--cds-text-secondary)">Položíte ho lícem nahoru a ukážete</text><text x="422" y="438" font-size="11.5" fill="var(--cds-text-secondary)">obrázek ostatním. Pak doplníte ruku</text><text x="422" y="454" font-size="11.5" fill="var(--cds-text-secondary)">na 4 karty Key z libovolného Altar.</text></g><g><polygon points="406,556 571,508 736,556 571,604" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></polygon><text x="571" y="548" text-anchor="middle" fill="var(--cds-text-primary)">Máte teď tolik Keys,</text><text x="571" y="564" text-anchor="middle" fill="var(--cds-text-primary)">že hra končí?</text></g><g><rect x="24" y="508" width="330" height="96" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="40" y="532" font-weight="600" fill="v
