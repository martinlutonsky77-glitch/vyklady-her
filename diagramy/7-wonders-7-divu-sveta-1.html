 x="290" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="var(--cds-text-primary)">2</text><text x="310" y="80" font-weight="600" fill="var(--cds-text-primary)">Volba karty</text><rect x="284" y="96" width="52" height="64" rx="6" fill="var(--cds-chart-categorical-2)" fill-opacity="0.25" stroke="var(--cds-chart-categorical-2)" stroke-width="1.25"></rect><text x="310" y="136" text-anchor="middle" font-size="20" font-weight="600" fill="var(--cds-text-primary)">?</text><text x="348" y="132" font-weight="600" fill="var(--cds-text-primary)">Zaplatím ji?</text><text x="284" y="184" font-size="11.5" fill="var(--cds-text-primary)">U každé karty se ptáte:</text><text x="284" y="200" font-size="11.5" fill="var(--cds-text-primary)">„Zaplatím ji z toho, co mám?“</text><text x="284" y="216" font-size="11.5" fill="var(--cds-text-primary)">Karta s prázdnou cenou je</text><text x="284" y="232" font-size="11.5" fill="var(--cds-text-primary)">zdarma, karta za 1 minci</text><text x="284" y="248" font-size="11.5" fill="var(--cds-text-primary)">stojí minci z pokladnice.</text></g><g><rect x="508" y="52" width="224" height="216" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><circle cx="530" cy="76" r="11" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="1.25"></circle><text x="530" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="var(--cds-text-primary)">3</text><text x="550" y="80" font-weight="600" fill="var(--cds-text-primary)">Odkrytí karet</text><rect x="524" y="96" width="52" height="64" rx="6" fill="var(--cds-chart-categorical-3)" fill-opacity="0.25" stroke="var(--cds-chart-categorical-3)" stroke-width="1.25"></rect><text x="550" y="136" text-anchor="middle" font-size="20" font-weight="600" fill="var(--cds-text-primary)">1</text><text x="588" y="132" font-weight="600" fill="var(--cds-text-primary)">vybraná karta</text><text x="524" y="184" font-size="11.
