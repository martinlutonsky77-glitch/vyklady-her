<figure class="schema"><div class="schema-plocha"><svg viewBox="0 0 760 486" role="img" aria-label="Kolo ve dvou fázích: Fáze Lumy a Fáze stínů, Luma zvítězí hned po splnění cíle scény, stín po dojití na prostřední pole" font-size="13"><defs><marker id="tah-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="24" y="32" font-size="15" font-weight="600" fill="var(--cds-text-primary)">Kolo má dvě fáze a scéna může skončit vítězstvím Lumy, nebo stínu</text><rect x="24" y="52" width="66" height="40" rx="6" fill="var(--cds-chart-categorical-2)" fill-opacity="0.25" stroke="var(--cds-chart-categorical-2)" stroke-width="1.25"></rect><text x="57" y="77" text-anchor="middle" font-size="13" font-weight="600" fill="var(--cds-text-primary)">3+</text><rect x="96" y="52" width="66" height="40" rx="6" fill="var(--cds-chart-categorical-2)" fill-opacity="0.25" stroke="var(--cds-chart-categorical-2)" stroke-width="1.25"></rect><text x="129" y="77" text-anchor="middle" font-size="13" font-weight="600" fill="var(--cds-text-primary)">4+</text><rect x="168" y="52" width="66" height="40" rx="6" fill="var(--cds-chart-categorical-2)" fill-opacity="0.25" stroke="var(--cds-chart-categorical-2)" stroke-width="1.25"></rect><text x="201" y="77" text-anchor="middle" font-size="13" font-weight="600" fill="var(--cds-text-primary)">5+</text><rect x="240" y="52" width="66" height="40" rx="6" fill="var(--cds-chart-categorical-2)" fill-opacity="0.25" stroke="var(--cds-chart-categorical-2)" stroke-width="1.25"></rect><text x="273" y="77" text-anchor="middle" font-size="13" font-weight="600" fill="var(--cds-text-primary)">6+</text><rect x="312" y="52" width="66" height="40" rx="6" fill="none" fill-opacity="0.25" stroke="var(--cds-chart-axis)" stroke-width="1.25" stroke-dasharray="4 4"></rect><text x="345" y="77" text-anchor="middle" font-size="11.5" fill="var(--cds-text-primary)">bez čísla</text><rect x="384" y="52" width="66" height="40" rx="6" fill="none" fill-opacity="0.25" stroke="var(--cds-chart-axis)" stroke-width="1.25" stroke-dasharray="4 4"></rect><text x="417" y="77" text-anchor="middle" font-size="11.5" fill="var(--cds-text-primary)">bez čísla</text><rect x="456" y="52" width="66" height="40" rx="6" fill="none" fill-opacity="0.25" stroke="var(--cds-chart-axis)" stroke-width="1.25" stroke-dasharray="4 4"></rect><text x="489" y="77" text-anchor="middle" font-size="11.5" fill="var(--cds-text-primary)">bez čísla</text><text x="548" y="62" font-size="11.5" fill="var(--cds-text-secondary)">Řeka má čtyři pole s číslem</text><text x="548" y="78" font-size="11.5" fill="var(--cds-text-secondary)">a tři pole bez čísla. Použít</text><text x="548" y="94" font-size="11.5" fill="var(--cds-text-secondary)">jde jen kartu na poli</text><text x="548" y="110" font-size="11.5" fill="var(--cds-text-secondary)">s číslem.</text><text x="24" y="112" font-size="11.5" fill="var(--cds-text-secondary)">V řece leží karty akcí Světlo, Pomoc, Průzkum a Léčení.</text><g><rect x="24" y="128" width="712" height="96" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="38" y="154" font-weight="600" fill="var(--cds-text-primary)">1 · Fáze Lumy</text><text x="38" y="174" font-size="11.5" fill="var(--cds-text-secondary)">Hodíš volnými kostkami a použiješ kartu z řeky: horní nebo dolní účinek. Použitou kartu posuneš na konec</text><text x="38" y="190" font-size="11.5" fill="var(--cds-text-secondary)">řeky a zavřeš mezery. Fázi smíš ukončit kdykoli.</text><text x="38" y="206" font-size="11.5" fill="var(--cds-text-secondary)">Jakmile některou akcí splníš cíl scény, Luma zvítězí a scéna končí, i když fáze ještě neskončila.</text></g><g><rect x="24" y="264" width="220" height="80" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="38" y="290" font-weight="600" fill="var(--cds-text-primary)">Luma zvítězí</text><text x="38" y="310" font-size="11.5" fill="var(--cds-text-secondary)">Kniha určí oddíl, který</text><text x="38" y="326" font-size="11.5" fill="var(--cds-text-secondary)">přečteš.</text></g><g><rect x="270" y="264" width="466" height="96" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="284" y="290" font-weight="600" fill="var(--cds-text-primary)">2 · Fáze stínů</text><text x="284" y="310" font-size="11.5" fill="var(--cds-text-secondary)">Tvorové v řece se aktivují zleva doprava a každý ti ubere</text><text x="284" y="326" font-size="11.5" fill="var(--cds-text-secondary)">ducha. Pak ukazatel stínu postoupí o 1 pole ke středu</text><text x="284" y="342" font-size="11.5" fill="var(--cds-text-secondary)">a vyhodnotíš ikony na poli.</text></g><g><polygon points="393,425 503,390 613,425 503,460" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></polygon><text x="503" y="421" text-anchor="middle" fill="var(--cds-text-primary)">Je ukazatel stínu</text><text x="503" y="437" text-anchor="middle" fill="var(--cds-text-primary)">na prostředním poli?</text></g><g><rect x="24" y="377" width="220" height="96" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="38" y="403" font-weight="600" fill="var(--cds-text-primary)">Stín zvítězí</text><text x="38" y="423" font-size="11.5" fill="var(--cds-text-secondary)">Přečteš oddíl, který určí</text><text x="38" y="439" font-size="11.5" fill="var(--cds-text-secondary)">kniha. Prohra hru nekončí,</text><text x="38" y="455" font-size="11.5" fill="var(--cds-text-secondary)">příběh jde temnější větví.</text></g><g fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"><path d="M134 224V264" marker-end="url(#tah-arrow)"></path><path d="M503 224V264" marker-end="url(#tah-arrow)"></path><path d="M503 360V390" marker-end="url(#tah-arrow)"></path><path d="M393 425H244" marker-end="url(#tah-arrow)"></path><path d="M613 425H748V176H736" marker-end="url(#tah-arrow)"></path></g><text x="142" y="248" font-size="11.5" fill="var(--cds-text-secondary)">Cíl scény je splněný.</text><text x="511" y="248" font-size="11.5" fill="var(--cds-text-secondary)">Fázi ukončíš bez splněného cíle.</text><text x="318" y="417" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">ano</text><text x="621" y="417" font-size="11.5" fill="var(--cds-text-secondary)">ne, začne</text><text x="621" y="447" font-size="11.5" fill="var(--cds-text-secondary)">další kolo</text></svg></div><figcaption>řeka karet, fáze Lumy a stínů, konec scény</figcaption></figure>
