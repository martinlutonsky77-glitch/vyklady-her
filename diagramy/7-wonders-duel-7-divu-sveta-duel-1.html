l-1)" stroke-width="1.25"></circle><text x="290" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="var(--cds-text-primary)">2</text><text x="310" y="80" font-weight="600" fill="var(--cds-text-primary)">Přečtete si cenu</text><rect x="284" y="96" width="52" height="64" rx="6" fill="var(--cds-chart-categorical-2)" fill-opacity="0.25" stroke="var(--cds-chart-categorical-2)" stroke-width="1.25"></rect><text x="310" y="136" text-anchor="middle" font-size="20" font-weight="600" fill="var(--cds-text-primary)">?</text><text x="348" y="132" font-weight="600" fill="var(--cds-text-primary)">Co stojí?</text><text x="284" y="184" font-size="11.5" fill="var(--cds-text-primary)">Prázdné pole ceny: karta je</text><text x="284" y="200" font-size="11.5" fill="var(--cds-text-primary)">zdarma. Cena v mincích se</text><text x="284" y="216" font-size="11.5" fill="var(--cds-text-primary)">platí bance. Suroviny, které</text><text x="284" y="232" font-size="11.5" fill="var(--cds-text-primary)">už vyrábíte, se nikdy</text><text x="284" y="248" font-size="11.5" fill="var(--cds-text-primary)">neutrácejí.</text></g><g><rect x="508" y="52" width="224" height="216" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><circle cx="530" cy="76" r="11" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="1.25"></circle><text x="530" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="var(--cds-text-primary)">3</text><text x="550" y="80" font-weight="600" fill="var(--cds-text-primary)">Postavíte zdarma</text><rect x="524" y="96" width="52" height="64" rx="6" fill="var(--cds-chart-categorical-3)" fill-opacity="0.25" stroke="var(--cds-chart-categorical-3)" stroke-width="1.25"></rect><text x="550" y="136" text-anchor="middle" font-size="20" font-weight="600" fill="var(--cds-text-primary)">0</text><text x="588" y="132" font-weight="600" fill="var(--cds-text-primary)">hnědá karta</text><text x="524" y="184" font-size="11.5" fill="var(--cds-text-primary)">Vezmete kartu s prázdným</text><text x="524" y="200" font-size="11.5" fill="var(--cds-text-primary)">polem ceny a postavíte ji.</text><text x="524" y="216" font-size="11.5" fill="var(--cds-text-primary)">Je-li hnědá, vyrábí surovinu</text><text x="524" y="232" font-size="11.5" fill="var(--cds-text-primary)">už navždy. Suroviny se totiž</text><text x="524" y="248" font-size="11.5" fill="var(--cds-text-primary)">neutrácejí.</text></g><g><rect x="28" y="284" width="224" height="216" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><circle cx="50" cy="308" r="11" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="1.25"></circle><text x="50" y="312" text-anchor="middle" font-size="12" font-weight="600" fill="var(--cds-text-primary)">4</text><text x="70" y="312" font-weight="600" fill="var(--cds-text-primary)">Cena surovin</text><rect x="44" y="328" width="52" height="64" rx="6" fill="var(--cds-chart-categorical-4)" fill-opacity="0.25" stroke="var(--cds-chart-categorical-4)" stroke-width="1.25"></rect><text x="70" y="368" text-anchor="middle" font-size="20" font-weight="600" fill="var(--cds-text-primary)">12</text><text x="108" y="364" font-weight="600" fill="var(--cds-text-primary)">mincí bance</text><text x="44" y="416" font-size="11.5" fill="var(--cds-text-primary)">Stavba stojí 3 kameny, které</text><text x="44" y="432" font-size="11.5" fill="var(--cds-text-primary)">nevyrábíte. Soupeř vyrábí</text><text x="44" y="448" font-size="11.5" fill="var(--cds-text-primary)">2 kameny hnědými kartami.</text><text x="44" y="464" font-size="11.5" fill="var(--cds-text-primary)">Každý kámen stojí 4 mince,</text><text x="44" y="480" font-size="11.5" fill="var(--cds-text-primary)">dohromady 12 mincí bance.</text></g><g><rect x="268" y="284" width="224" height="216" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><circle cx="290" cy="308" r="11" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="1.25"></circle><text x="290" y="312" text-anchor="middle" font-size="12" font-weight="600" fill="var(--cds-text-primary)">5</text><text x="310" y="312" font-weight="600" fill="var(--cds-text-primary)">Odhodíte za mince</text><rect x="284" y="328" width="52" height="64" rx="6" fill="var(--cds-chart-categorical-5)" fill-opacity="0.25" stroke="var(--cds-chart-categorical-5)" stroke-width="1.25"></rect><text x="310" y="368" text-anchor="middle" font-size="20" font-weight="600" fill="var(--cds-text-primary)">+2</text><text x="348" y="364" font-weight="600" fill="var(--cds-text-primary)">mince z banky</text><text x="284" y="416" font-size="11.5" fill="var(--cds-text-primary)">Nic nevyhovuje? Kartu odhoďte</text><text x="284" y="432" font-size="11.5" fill="var(--cds-text-primary)">lícem dolů a vezměte si</text><text x="284" y="448" font-size="11.5" fill="var(--cds-text-primary)">2 mince plus 1 za každou</text><text x="284" y="464" font-size="11.5" fill="var(--cds-text-primary)">svou žlutou kartu.</text></g><g><rect x="508" y="284" width="224" height="216" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><circle cx="530" cy="308" r="11" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="1.25"></circle><text x="530" y="312" text-anchor="middle" font-size="12" font-weight="600" fill="var(--cds-text-primary)">6</text><text x="550" y="312" font-weight="600" fill="var(--cds-text-primary)">Hraje soupeř</text><rect x="524" y="328" width="52" height="64" rx="6" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" stroke-dasharray="4 4"></rect><text x="588" y="364" font-weight="600" fill="var(--cds-text-primary)">soupeř na tahu</text><text x="524" y="416" font-size="11.5" fill="var(--cds-text-primary)">Po zahrání karty odkryjete</text><
